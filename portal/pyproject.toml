[project]
name = "beachhub-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  # beachhub-shared wird separat installiert: pip install -e ../shared
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "itsdangerous==2.2.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "apscheduler==3.11.0",
]
[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "mypy==1.13.0", "httpx==0.28.1"]
[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["beachhub_portal*"]
[tool.setuptools.package-data]
beachhub_portal = ["templates/**/*", "static/*"]
[tool.pytest.ini_options]
# Nur, um die PytestDeprecationWarning von pytest-asyncio zu vermeiden (in derselben Umgebung
# für hall/ installiert); die Tests hier nutzen selbst keine asyncio-Fixtures.
asyncio_default_fixture_loop_scope = "function"
