# Betrieb neben Home Assistant. Netzwerk des Hosts, damit HA (127.0.0.1:8123) und der
# WireGuard-Tunnel zum Hauptsystem ohne weitere Weiterleitung erreichbar sind.
services:
  hall:
    build: { context: .., dockerfile: hall/Dockerfile }
    restart: unless-stopped
    network_mode: host
    env_file: .env
    # Zeit für das geordnete Herunterfahren: Dienst.schliesse() schaltet einen offenen
    # switch.*-Türöffner aus (bis zu 3 Versuche à höchstens 5 s mit je 1 s Pause, siehe
    # beachhub_hall/tuer.py) und schließt die Verbindungen, bevor der Prozess endet. Danach
    # schickt Docker SIGKILL – 60 s lassen reichlich Luft.
    stop_grace_period: 60s
    # CORE_URL zeigt auf den Hostnamen der Caddy-Site des Hauptsystems (kern.beachhub.wg), nicht
    # auf ihre nackte IP – für eine IP-Adresse schickt der TLS-Client kein SNI, ohne SNI griffe
    # die client_auth-Richtlinie bei Caddy nie (docs/betrieb/hauptsystem.md, „5b. Hallendienst
    # anbinden“). Weicht die WireGuard-Adresse des Hauptsystems von 10.8.0.1 ab, hier anpassen.
    extra_hosts:
      - "kern.beachhub.wg:10.8.0.1"
    volumes:
      - "./data:/data"
      - "./hall.toml:/config/hall.toml:ro"
      - "./zertifikate:/zertifikate:ro"
