[project]
name = "beachhub-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.10.3",
  "pynacl==1.5.0",
  "argon2-cffi==25.1.0",
]
[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "mypy==1.13.0"]
[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["beachhub_shared*"]
[tool.pytest.ini_options]
# Nur, um die PytestDeprecationWarning von pytest-asyncio zu vermeiden (in derselben Umgebung
# für hall/ installiert); die Tests hier nutzen selbst keine asyncio-Fixtures.
asyncio_default_fixture_loop_scope = "function"
